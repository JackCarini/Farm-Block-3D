<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fazenda Blocky Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: sans-serif; background: #111; color: #fff; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; z-index: 10; }
        .interactive { pointer-events: auto; }
        .game-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 2px solid rgba(59, 130, 246, 0.5); border-radius: 16px; }
    </style>
</head>
<body>

    <!-- UI LAYER (MÓVEL) -->
    <div id="ui-layer">
        <!-- TOP HUD -->
        <div class="flex justify-between items-center w-full">
            <div class="flex gap-2">
                <div class="game-panel px-3 py-1 flex items-center gap-1.5">
                    <span class="text-xl">🪙</span>
                    <span id="hud-coins" class="text-sm font-black text-amber-400">150</span>
                </div>
                <div class="game-panel px-3 py-1 flex items-center gap-1.5">
                    <span class="text-xl">📦</span>
                    <span id="hud-packs" class="text-sm font-black text-blue-400">3</span>
                </div>
            </div>
            
            <div class="flex gap-1.5 interactive">
                <button onclick="openMenu('custom')" class="bg-emerald-600 font-bold px-3 py-1.5 rounded-xl text-xs border border-emerald-400">👤 Avatar</button>
                <button onclick="openMenu('album')" class="bg-purple-600 font-bold px-3 py-1.5 rounded-xl text-xs border border-purple-400">📖 Cards</button>
                <button onclick="openMenu('missions')" class="bg-amber-600 font-bold px-3 py-1.5 rounded-xl text-xs border border-amber-400">⭐ Missões</button>
            </div>
        </div>

        <!-- NOTIFICAÇÕES -->
        <div id="notification-box" class="self-center bg-black/80 border border-amber-500/50 text-amber-300 px-4 py-1.5 rounded-full text-xs font-semibold opacity-0 transition-opacity pointer-events-none">
            Aviso
        </div>

        <!-- CONTROLES TÁTEIS (JOYSTICK + PULO) -->
        <div class="flex justify-between items-end w-full pb-2">
            <!-- Joystick Virtual -->
            <div id="joystick-zone" class="relative w-28 h-28 bg-white/10 rounded-full border border-white/20 interactive flex items-center justify-center">
                <div id="joystick-knob" class="absolute w-10 h-10 bg-white/60 rounded-full pointer-events-none"></div>
            </div>
            <!-- Botões de Ação -->
            <div class="flex gap-2 interactive">
                <button id="btn-action" onclick="triggerAction()" class="w-16 h-16 bg-emerald-500 border-2 border-emerald-300 rounded-full flex items-center justify-center text-xl shadow-xl active:scale-90">🖐️</button>
                <button id="btn-jump" onclick="triggerJump()" class="w-16 h-16 bg-blue-500 border-2 border-blue-300 rounded-full flex items-center justify-center text-xl shadow-xl active:scale-90">⬆️</button>
            </div>
        </div>
    </div>

    <!-- MENUS (AVATAR, CARDS, MISSÕES, GACHA) -->
    <div id="menu-custom" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="game-panel w-full max-w-xs p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h2 class="text-base font-bold text-emerald-400">Customizar Avatar</h2>
                <button onclick="closeMenus()" class="text-slate-400 text-lg">✕</button>
            </div>
            <div class="flex flex-col gap-2 text-xs">
                <label>Cor da Pele: <input type="color" id="opt-skin" value="#fcd34d" onchange="updateAvatar()" class="w-full h-8 rounded"></label>
                <label>Cor da Camisa: <input type="color" id="opt-shirt" value="#3b82f6" onchange="updateAvatar()" class="w-full h-8 rounded"></label>
                <label>Cor da Calça: <input type="color" id="opt-pants" value="#1e293b" onchange="updateAvatar()" class="w-full h-8 rounded"></label>
                <label>Acessório: 
                    <select id="opt-hat" onchange="updateAvatar()" class="w-full mt-1 p-1 bg-slate-800 rounded text-xs">
                        <option value="none">Nenhum</option>
                        <option value="cap">Boné</option>
                        <option value="straw">Chapéu de Palha</option>
                    </select>
                </label>
            </div>
            <button onclick="closeMenus()" class="bg-emerald-600 font-bold py-2 rounded-xl text-xs">Jogar</button>
        </div>
    </div>

    <div id="menu-album" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="game-panel w-full max-w-sm p-4 flex flex-col gap-3 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h2 class="text-base font-bold text-purple-400">Álbum de Cards</h2>
                <button onclick="closeMenus()" class="text-slate-400 text-lg">✕</button>
            </div>
            <button onclick="openGacha()" class="bg-amber-500 text-slate-950 font-black p-2 rounded-lg text-xs">📦 Abrir Pacotes (<span id="pack-count-lbl">3</span>)</button>
            <div id="album-grid" class="flex flex-col gap-2 overflow-y-auto max-h-[50vh]"></div>
        </div>
    </div>

    <div id="menu-gacha" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <h2 class="text-lg font-black text-amber-400 mb-2">NOVOS CARDS!</h2>
        <div id="gacha-card-container" class="flex flex-wrap justify-center gap-2 mb-4"></div>
        <button id="gacha-close-btn" onclick="closeGacha()" class="bg-blue-600 font-bold px-4 py-2 rounded-xl text-xs">Continuar</button>
    </div>

    <div id="menu-missions" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="game-panel w-full max-w-xs p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h2 class="text-base font-bold text-amber-400">Missões</h2>
                <button onclick="closeMenus()" class="text-slate-400 text-lg">✕</button>
            </div>
            <div class="flex flex-col gap-2">
                <button onclick="startMission(1)" class="bg-slate-800 p-2 rounded-lg text-left text-xs border border-slate-700 flex justify-between items-center">
                    <div><b>1. Apple Run</b><br><span class="text-[10px] text-slate-400">Coletar maçãs</span></div>
                    <span class="bg-emerald-600 px-2 py-1 rounded text-[10px]">Iniciar</span>
                </button>
                <button onclick="startMission(2)" class="bg-slate-800 p-2 rounded-lg text-left text-xs border border-slate-700 flex justify-between items-center">
                    <div><b>2. Celeiro Parkour</b><br><span class="text-[10px] text-slate-400">Subir fardos</span></div>
                    <span class="bg-blue-600 px-2 py-1 rounded text-[10px]">Iniciar</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const DATABASE_CARDS = [
            { id: 'chicken', name: 'Galinha Caipira', rarity: 'Comum', color: '#94a3b8' },
            { id: 'pig', name: 'Porquinho Rosa', rarity: 'Comum', color: '#94a3b8' },
            { id: 'sheep', name: 'Ovelha Fofinha', rarity: 'Raro', color: '#3b82f6' },
            { id: 'cow', name: 'Vaca Malhada', rarity: 'Raro', color: '#3b82f6' },
            { id: 'horse', name: 'Cavalo Campeão', rarity: 'Ultra Raro', color: '#a855f7' },
            { id: 'bull', name: 'Touro Bravo', rarity: 'Épico', color: '#eab308' },
            { id: 'dragon', name: 'Dragão Dourado', rarity: 'Lendário', color: '#ef4444' }
        ];

        let playerState = {
            coins: 150, packs: 3,
            cards: { chicken: 1, pig: 1 },
            audioRecordings: {},
            avatar: { skin: '#fcd34d', shirt: '#3b82f6', pants: '#1e293b', hat: 'straw' }
        };

        let scene, camera, renderer, player, avatarGroup;
        let cameraAngle = 0, cameraDistance = 10, cameraHeight = 5;
        let petsInFarm = [];
        let joyActive = false, joyStartX = 0, joyStartY = 0, joyDeltaX = 0, joyDeltaY = 0;
        let velocityY = 0, isJumping = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            createFarmMap();
            createPlayer();
            setupMobileControls();
            updateFarmPets();

            window.addEventListener('resize', onWindowResize);
            animLoop();
        }

        function createFarmMap() {
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: 0x55a630 }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Cercado
            const pen = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshBasicMaterial({ color: 0x606c38 }));
            pen.rotation.x = -Math.PI / 2;
            pen.position.set(-10, 0.02, -10);
            scene.add(pen);
        }

        function createPlayer() {
            player = new THREE.Group();
            scene.add(player);
            avatarGroup = new THREE.Group();
            player.add(avatarGroup);
            buildAvatarMesh();
        }

        function buildAvatarMesh() {
            while(avatarGroup.children.length > 0) avatarGroup.remove(avatarGroup.children[0]);
            const skinMat = new THREE.MeshBasicMaterial({ color: playerState.avatar.skin });
            const shirtMat = new THREE.MeshBasicMaterial({ color: playerState.avatar.shirt });
            const pantsMat = new THREE.MeshBasicMaterial({ color: playerState.avatar.pants });

            const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), skinMat);
            head.position.y = 3.5; avatarGroup.add(head);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.6), shirtMat);
            torso.position.y = 2.2; avatarGroup.add(torso);

            const legs = new THREE.Mesh(new THREE.BoxGeometry(1, 1.4, 0.5), pantsMat);
            legs.position.y = 0.7; avatarGroup.add(legs);
        }

        function updateAvatar() {
            playerState.avatar.skin = document.getElementById('opt-skin').value;
            playerState.avatar.shirt = document.getElementById('opt-shirt').value;
            playerState.avatar.pants = document.getElementById('opt-pants').value;
            playerState.avatar.hat = document.getElementById('opt-hat').value;
            buildAvatarMesh();
        }

        function setupMobileControls() {
            const joyZone = document.getElementById('joystick-zone');
            const joyKnob = document.getElementById('joystick-knob');

            joyZone.addEventListener('touchstart', (e) => {
                joyActive = true;
                const touch = e.touches[0];
                joyStartX = touch.clientX; joyStartY = touch.clientY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if(!joyActive) return;
                const touch = e.touches[0];
                joyDeltaX = touch.clientX - joyStartX;
                joyDeltaY = touch.clientY - joyStartY;
                let dist = Math.hypot(joyDeltaX, joyDeltaY);
                if(dist > 35) {
                    joyDeltaX = (joyDeltaX / dist) * 35;
                    joyDeltaY = (joyDeltaY / dist) * 35;
                }
                joyKnob.style.transform = `translate(${joyDeltaX}px, ${joyDeltaY}px)`;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                joyActive = false;
                joyDeltaX = 0; joyDeltaY = 0;
                joyKnob.style.transform = `translate(0px, 0px)`;
            });

            // Gira câmara ao deslizar na parte direita do ecrã
            let touchCamStartX = 0;
            window.addEventListener('touchstart', (e) => {
                if(e.touches[0].clientX > window.innerWidth / 2) {
                    touchCamStartX = e.touches[0].clientX;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if(e.touches[0].clientX > window.innerWidth / 2) {
                    let deltaX = e.touches[0].clientX - touchCamStartX;
                    cameraAngle -= deltaX * 0.005;
                    touchCamStartX = e.touches[0].clientX;
                }
            }, { passive: true });
        }

        function triggerJump() {
            if(!isJumping) { velocityY = 0.3; isJumping = true; }
        }

        function triggerAction() { showNotification("Ação executada!"); }

        function animLoop() {
            requestAnimationFrame(animLoop);

            if(joyActive) {
                let moveX = joyDeltaX / 35;
                let moveZ = joyDeltaY / 35;

                let camForwardX = Math.sin(cameraAngle);
                let camForwardZ = Math.cos(cameraAngle);
                let camRightX = Math.cos(cameraAngle);
                let camRightZ = -Math.sin(cameraAngle);

                let dirX = camForwardX * (-moveZ) + camRightX * moveX;
                let dirZ = camForwardZ * (-moveZ) + camRightZ * moveX;

                player.position.x += dirX * 0.15;
                player.position.z += dirZ * 0.15;
                player.rotation.y = Math.atan2(dirX, dirZ);
            }

            player.position.y += velocityY;
            if(player.position.y > 0) velocityY -= 0.02;
            else { player.position.y = 0; isJumping = false; velocityY = 0; }

            camera.position.set(
                player.position.x + Math.sin(cameraAngle) * cameraDistance,
                player.position.y + cameraHeight,
                player.position.z + Math.cos(cameraAngle) * cameraDistance
            );
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

            renderer.render(scene, camera);
        }

        function recordAudioForCard(id) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                let mr = new MediaRecorder(stream);
                let chunks = [];
                mr.ondataavailable = e => chunks.push(e.data);
                mr.onstop = () => {
                    let blob = new Blob(chunks, { type: 'audio/webm' });
                    playerState.audioRecordings[id] = URL.createObjectURL(blob);
                    showNotification("Som do bichinho gravado!");
                    updateAlbumUI();
                };
                mr.start();
                showNotification("Gravando som...");
                setTimeout(() => { if(mr.state === 'recording') mr.stop(); }, 2000);
            }).catch(() => showNotification("Microfone desativado."));
        }

        function updateFarmPets() {
            petsInFarm.forEach(p => scene.remove(p));
            petsInFarm = [];
            let idx = 0;
            for(let id in playerState.cards) {
                if(playerState.cards[id] > 0) {
                    let c = DATABASE_CARDS.find(x => x.id === id);
                    let m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: c.color }));
                    m.position.set(-14 + (idx%3)*3, 0.4, -14 + Math.floor(idx/3)*3);
                    scene.add(m);
                    petsInFarm.push(m);
                    idx++;
                }
            }
        }

        function openMenu(name) {
            closeMenus();
            if(name === 'custom') document.getElementById('menu-custom').classList.remove('hidden');
            if(name === 'album') { updateAlbumUI(); document.getElementById('menu-album').classList.remove('hidden'); }
            if(name === 'missions') document.getElementById('menu-missions').classList.remove('hidden');
        }

        function closeMenus() {
            document.getElementById('menu-custom').classList.add('hidden');
            document.getElementById('menu-album').classList.add('hidden');
            document.getElementById('menu-missions').classList.add('hidden');
        }

        function updateAlbumUI() {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';
            DATABASE_CARDS.forEach(card => {
                let count = playerState.cards[card.id] || 0;
                let hasAudio = playerState.audioRecordings[card.id] ? '🔊 Ouvir/Gravar' : '🎤 Gravar Voz';
                let el = document.createElement('div');
                el.className = 'p-2 rounded bg-slate-800 border border-slate-700 flex justify-between items-center text-xs';
                el.innerHTML = `
                    <div><b style="color:${card.color}">${card.name}</b> (${card.rarity}) x${count}</div>
                    <button onclick="recordAudioForCard('${card.id}')" class="bg-purple-600 px-2 py-1 rounded text-[10px] font-bold">${hasAudio}</button>
                `;
                grid.appendChild(el);
            });
            document.getElementById('pack-count-lbl').innerText = playerState.packs;
            document.getElementById('hud-packs').innerText = playerState.packs;
        }

        function openGacha() {
            if(playerState.packs <= 0) { showNotification("Sem pacotes!"); return; }
            playerState.packs--;
            closeMenus();
            document.getElementById('menu-gacha').classList.remove('hidden');
            
            const container = document.getElementById('gacha-card-container');
            container.innerHTML = '';

            for(let i=0; i<2; i++) {
                let card = DATABASE_CARDS[Math.floor(Math.random() * DATABASE_CARDS.length)];
                playerState.cards[card.id] = (playerState.cards[card.id] || 0) + 1;
                let el = document.createElement('div');
                el.className = 'w-24 h-32 bg-slate-800 border border-amber-400 rounded p-2 text-center text-xs flex flex-col justify-between';
                el.innerHTML = `<b style="color:${card.color}">${card.name}</b><div>${card.rarity}</div>`;
                container.appendChild(el);
            }
            updateFarmPets();
        }

        function closeGacha() {
            document.getElementById('menu-gacha').classList.add('hidden');
            openMenu('album');
        }

        function startMission(id) {
            closeMenus();
            playerState.packs += 1;
            playerState.coins += 30;
            showNotification("Missão concluída! +1 Pacote obtido!");
            updateAlbumUI();
        }

        function showNotification(msg) {
            const box = document.getElementById('notification-box');
            box.innerText = msg; box.style.opacity = '1';
            setTimeout(() => box.style.opacity = '0', 2500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
